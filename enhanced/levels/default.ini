# Enhanced graphics settings used by every level without its own file.
# Order, later overriding key by key: built-in, default.ini, <level>.ini (woods), <stage>.ini (woods_a).
# Saved from the F1 panel with "Save for level" / "Save for zone". Format: key=value.
# First values for tuning, not meant to be accurate yet. World "up" is -Y.

grade.on=1
grade.strength=1
grade.exposure=1
grade.contrast=1.05
grade.saturation=1.1
grade.tint=1,1,1

bloom.on=1
bloom.strength=0.5
bloom.threshold=0.75
bloom.radius=1

fog.on=1
fog.strength=0.35
fog.color=0.55,0.65,0.78
fog.start=1500
fog.end=12000
fog.height=0
fog.falloff=0.2
fog.sky=0.3

ao.on=1
ao.strength=0.4
ao.radius=40
ao.bias=0.15

dof.on=1
dof.strength=0.3
# 0 = focus on whatever is at the screen centre
dof.focus=0
dof.range=1500
dof.blur=2

shafts.on=1
shafts.strength=0.25
shafts.length=1
shafts.decay=0.95

shadows.on=1
shadows.strength=0.4
shadows.length=300
shadows.softness=0.5

# Direction towards the sun
sun.dir=0.35,-0.8,0.5
sun.color=1,0.93,0.8
